</head><body><header><div><div class="brand">REP<b>▰</b></div><div class="sub">STREET WORKOUT</div></div><span class="pill">IRON ONLY</span></header><main id="app"></main><nav class="nav" id="nav"></nav><script>
const exercises={pull:{name:'Pull-ups',max:8,variations:['Pull-ups','Chin-ups','Close-grip pull-ups','Wide-grip pull-ups','Commando pull-ups']},push:{name:'Push-ups',max:28,variations:['Push-ups','Deep handle push-ups','Diamond push-ups','Wide push-ups','Decline push-ups','Pike push-ups']},legs:{name:'Split squats',max:18,variations:['Split squats','Reverse lunges','Bodyweight squats','Bulgarian split squats']},core:{name:'Core',max:15,variations:['Hanging knee raises','Reverse crunches','Leg raises']}};
const library=[{id:'hannibal',name:'Around the World',author:'Hannibal for King',source:'Community-attributed; verify original prescription',type:'Circuit',rounds:5,rest:60,items:[{name:'Pull-ups',reps:5},{name:'Dips',reps:5},{name:'Push-ups',reps:10}]},{id:'snoop',name:'Snoop Challenge',author:'Bar-Barians',source:'Community-attributed; verify original prescription',type:'Circuit',rounds:10,rest:45,items:[{name:'Pull-ups',reps:5},{name:'Push-ups',reps:5}]},{id:'iron',name:'Iron Volume',author:'REP original · high-rep inspired',source:'Original REP routine, not an athlete-authored program',type:'Straight sets',rounds:5,rest:90,items:[{name:'Pull-ups',reps:4},{name:'Push-ups',reps:15},{name:'Split squats',reps:12}]},{id:'saibov',name:'Iron Wrists Adaptation',author:'Saibov-inspired · REP original',source:'REP-created adaptation; not a verified athlete prescription',type:'Circuit',rounds:1,rest:90,items:[{name:'Dips',reps:40},{name:'Pull-ups',reps:20},{name:'Push-ups',reps:50}]},{id:'zef',name:'Rep Builder',author:'Zef Zakaveli-inspired · REP original',source:'REP-created training challenge',type:'Ladder',rounds:5,rest:90,items:[{name:'Pull-ups',reps:4},{name:'Push-ups',reps:12}]},{id:'max',name:'Maximum Density',author:'Max True-inspired · REP original',source:'REP-created density challenge',type:'AMRAP',rounds:5,rest:60,items:[{name:'Pull-ups',reps:4},{name:'Push-ups',reps:12}]}];
const defaults={start:'2026-11-05',max:{pull:8,push:28,legs:18,core:15},excluded:['Dips','Muscle-ups','Rows','Ring dips'],logs:[],saved:{},active:null,monthModes:{'2026-11':'Pyramid','2026-12':'Straight sets','2027-01':'Volume','2027-02':'Circuit'}};let state;try{state={...defaults,...JSON.parse(localStorage.getItem('rep_v2')||'{}')}}catch{state=structuredClone(defaults)};let planOffset=0,sessionStep=0,sessionClock=null;let tab='home',genMode='Random',format='Circuit',goals={pull:100,push:300,legs:0,core:0},selected=['pull','push'],generated=null,editRoutine=null,seed=0,movementCount='random';const el=document.getElementById('app');function save(){localStorage.setItem('rep_v2',JSON.stringify(state))}function today(){return new Date().toLocaleDateString('en-CA')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function total(w){return w.items.reduce((a,x)=>a+x.reps*w.rounds,0)}function monthKey(offset=0){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}function phase(){const d=new Date();const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return (state.monthModes||{})[key]||state.defaultMonthMode||'Straight sets'}function plan(){const day=Math.max(0,Math.floor((Date.now()-new Date(state.start+'T00:00:00'))/864e5));const mult=[1,.5,.75,1,.5,.75,.5][day%7];const type=phase();const ids=['pull','push','legs'];const items=ids.map(id=>{const peak=Math.max(1,Math.round(state.max[id]*(id==='pull'?.5:.45)*mult));const reps=type==='Pyramid'?peak:Math.max(1,Math.round(state.max[id]*.4*mult));return {name:exercises[id].name,reps,id}});const w={id:'daily',name:'Daily '+type,type,rounds:type==='Pyramid'?7:type==='Volume'?5:3,rest:90,items,source:'Your structured daily plan'};if(type==='Pyramid'){w.pattern=[.25,.5,.75,1,.75,.5,.25];w.rounds=w.pattern.length}return w}
function repAt(w,x,j){return w.pattern?Math.max(1,Math.round(x.reps*w.pattern[j])):x.reps}
function targetTotal(w){return w.items.reduce((a,x)=>a+Array.from({length:w.rounds},(_,j)=>repAt(w,x,j)).reduce((a,b)=>a+b,0),0)}
function start(w){sessionStep=0;state.active={...structuredClone(w),done:{},started:Date.now()};save();tab='session';render()}function choose(t){tab=t;render()}function render(){const tabs=[['home','⌂','Home'],['generator','⚄','Workouts'],['library','▤','Library'],['progress','▥','Progress'],['settings','⚙','Profile']];document.getElementById('nav').innerHTML=tabs.map(([id,ico,name])=>`<button class="${tab===id?'active':''}" onclick="choose('${id}')"><span>${ico}</span>${name}</button>`).join('');el.innerHTML=tab==='home'?home():tab==='generator'?generator():tab==='library'?routineLibrary():tab==='routine'?routineDetail():tab==='session'?session():tab==='progress'?progress():settings()}
function home(){const d=plan();const volume=state.logs.reduce((a,l)=>a+l.actual,0);return `<div class="hero"><div class="hero-logo">REP<b>▰</b></div><div class="hero-sub">STREET WORKOUT</div><h2>Ready to train?</h2><span class="muted">DISCIPLINE. VOLUME. PROGRESS.</span></div><div class="grid" style="margin-bottom:15px"><div class="stat"><b>${state.logs.length}</b><small>Sessions</small></div><div class="stat"><b>${volume}</b><small>Reps logged</small></div><div class="stat"><b>${state.logs.length?Math.max(...state.logs.map(x=>x.actual)):0}</b><small>Best volume</small></div></div><button class="tile" onclick="choose('generator')"><span class="symbol">⚄</span><span><strong>Generate Workout</strong><small>Custom or goal-based workouts</small></span><span class="chev">›</span></button><button class="tile" onclick="choose('library')"><span class="symbol">▤</span><span><strong>Routine Library</strong><small>Hannibal, Bar-Barians & high-rep challenges</small></span><span class="chev">›</span></button><button class="tile" onclick="choose('progress')"><span class="symbol">▥</span><span><strong>My Progress</strong><small>Records, volume and PRs</small></span><span class="chev">›</span></button><div class="panel"><div class="row"><h3>Today's Program</h3><span class="pill">${d.type}</span></div>${d.items.map(x=>`<div class="row line"><span>${x.name}</span><b>${d.pattern?d.pattern.map((_,j)=>repAt(d,x,j)).join('–'):d.rounds+' × '+x.reps}</b></div>`).join('')}<p class="hint">Alternate hard, moderate and easy days. This is your default plan, separate from generated workouts.</p><button class="btn" onclick="start(plan())">▶ Start Daily Workout</button>${state.active?'<button class="btn secondary" onclick="choose(\'session\')">Resume active workout</button>':''}</div>`}
function generator(){return `<h2>Generate Workout</h2><div class="panel"><h3>Make it unpredictable</h3><p class="hint">Random exercises and variations from your approved iron-bar, handles and floor movements. Set optional total-rep goals.</p><label>Workout objective</label><div class="chips">${['Random','Goal reps'].map(m=>`<button class="chip ${genMode===m?'active':''}" onclick="genMode='${m}';render()">${m}</button>`).join('')}</div>${Object.entries(exercises).map(([id,x])=>`<div class="row line"><label style="margin:0"><input type="checkbox" ${selected.includes(id)?'checked':''} onchange="toggleEx('${id}',this.checked)"> ${x.name}</label>${genMode==='Goal reps'?`<input class="field small" type="number" min="0" max="5000" value="${goals[id]}" onchange="goals.${id}=Math.max(0,Number(this.value)||0)">`:''}</div>`).join('')}<label>Number of movements</label><select class="field" id="movementCount" onchange="movementCount=this.value"><option value="random" ${movementCount==='random'?'selected':''}>Surprise me (2–6)</option>${[2,3,4,5,6].map(n=>`<option value="${n}" ${movementCount===String(n)?'selected':''}>${n} exercises</option>`).join('')}</select><label>Workout structure</label><select class="field" id="workoutStructure" onchange="format=this.value"><option value="random" ${format==='random'?'selected':''}>Surprise me</option>${['Circuit','Superset','Straight sets','EMOM','AMRAP','Ladder'].map(x=>`<option value="${x}" ${format===x?'selected':''}>${x}</option>`).join('')}</select><p class="hint">Circuit: repeat all movements. Superset: alternate paired movements. Straight sets: finish one movement at a time. EMOM: work each minute. AMRAP: timed rounds. Ladder: reps climb and descend.</p><button class="btn" onclick="generate()">⚄ Generate Workout</button></div>${generated?`<div class="panel"><div class="row"><h3>Your Workout</h3><span class="pill">${generated.type}</span></div><p class="hint">${generated.rounds} rounds · ${targetTotal(generated)} target reps · ${generated.rest}s rest</p>${generated.items.map(x=>`<div class="row line"><span>${esc(x.name)}</span><b>${x.reps} / round</b></div>`).join('')}<button class="btn" onclick="start(generated)">▶ Start Workout</button><button class="btn secondary" onclick="generate()">⚄ Regenerate</button></div>`:''}`}
function toggleEx(id,v){selected=v?[...new Set([...selected,id])]:selected.filter(x=>x!==id);render()}
function generate(){format=document.getElementById('workoutStructure')?.value||format;movementCount=document.getElementById('movementCount')?.value||movementCount;if(!selected.length)return alert('Choose at least one movement category');const opts=Object.entries(exercises).filter(([id])=>selected.includes(id)).flatMap(([id,e])=>e.variations.filter(name=>!state.excluded.includes(name)).map(name=>({id,name})));if(!opts.length)return alert('All selected variations are excluded');const num=movementCount;const st=format;const structures=['Circuit','Superset','Straight sets','EMOM','AMRAP','Ladder'];const type=st==='random'?structures[Math.floor(Math.random()*structures.length)]:st;const wanted=num==='random'?2+Math.floor(Math.random()*5):Number(num);const shuffled=[...opts].sort(()=>Math.random()-.5);const chosen=shuffled.slice(0,Math.min(wanted,opts.length));const rounds=type==='EMOM'?10:type==='AMRAP'?5:4+Math.floor(Math.random()*3);const perCat={};for(const item of chosen)perCat[item.id]=(perCat[item.id]||0)+1;const items=chosen.map(x=>{const cap=state.max[x.id];const goal=genMode==='Goal reps'?Math.round((goals[x.id]||0)/perCat[x.id]):0;return {...x,reps:Math.max(1,genMode==='Goal reps'?Math.ceil(goal/rounds):Math.round(cap*(.25+Math.random()*.25)))}});generated={id:'generated-'+Date.now(),name:'Generated '+type,type,rounds,rest:type==='EMOM'?0:60,items,duration:type==='AMRAP'?'20-minute cap':null,goalTargets:genMode==='Goal reps'?{...goals}:null};render()}
function routineLibrary(){return `<h2>Routine Library</h2><p class="hint">High-rep street workout only. Source confidence is shown clearly; athlete-inspired REP workouts are not presented as official routines.</p><div class="chips"><span class="chip active">All</span><span class="chip">Bar-Barians</span><span class="chip">Hannibal</span><span class="chip">Saibov</span><span class="chip">Zef</span><span class="chip">Max True</span></div>${library.map(r=>`<button class="tile" onclick="editRoutine='${r.id}';choose('routine')"><span class="symbol">▤</span><span><strong>${esc(r.name)}</strong><small>${esc(r.author)} · ${r.type}</small></span><span class="chev">›</span></button>`).join('')}`}
function currentRoutine(){return state.saved[editRoutine]||library.find(r=>r.id===editRoutine)}function routineDetail(){const r=currentRoutine();if(!r)return '<p>Routine unavailable.</p>';return `<button class="mini" onclick="choose('library')">‹ Library</button><h2>${esc(r.name)}</h2><div class="chips"><span class="pill">${esc(r.author)}</span><span class="pill">${r.type}</span></div><div class="panel"><h3>Routine details</h3><p class="hint">${esc(r.source)}</p><div class="grid"><div class="stat"><b>${r.rounds}</b><small>Rounds</small></div><div class="stat"><b>${total(r)}</b><small>Target reps</small></div><div class="stat"><b>${r.rest}s</b><small>Rest</small></div></div><label>Structure</label><select class="field" onchange="updateRoutine('type',this.value)">${['Circuit','Superset','Straight sets','EMOM','AMRAP','Ladder'].map(v=>`<option ${r.type===v?'selected':''}>${v}</option>`).join('')}</select><label>Rounds</label><input class="field" type="number" min="1" max="50" value="${r.rounds}" onchange="updateRoutine('rounds',Number(this.value))"><label>Rest between rounds (seconds)</label><input class="field" type="number" min="0" max="600" value="${r.rest}" onchange="updateRoutine('rest',Number(this.value))"><h3 style="margin-top:18px">Exercises · tap to replace</h3>${r.items.map((x,i)=>`<div class="exercise"><div class="row"><select class="field" style="flex:1" onchange="updateItem(${i},'name',this.value)">${[...new Set([x.name,...Object.values(exercises).flatMap(e=>e.variations)])].map(v=>`<option ${x.name===v?'selected':''}>${esc(v)}</option>`).join('')}</select><input class="field small" type="number" min="0" max="500" value="${x.reps}" onchange="updateItem(${i},'reps',Number(this.value))"></div><button class="mini" style="margin-top:7px" onclick="removeItem(${i})">Remove exercise</button></div>`).join('')}<button class="btn secondary" onclick="addItem()">+ Add exercise</button><button class="btn" onclick="start(currentRoutine())">▶ Use This Routine</button><button class="btn secondary" onclick="resetRoutine()">Reset to original</button></div><div class="panel"><h3>Personal best</h3>${bestFor(r.id)}</div>`}
function ensureSaved(){if(!state.saved[editRoutine])state.saved[editRoutine]=structuredClone(library.find(x=>x.id===editRoutine));return state.saved[editRoutine]}function updateRoutine(k,v){let r=ensureSaved();r[k]=k==='rounds'?Math.max(1,Math.min(50,v||1)):k==='rest'?Math.max(0,Math.min(600,v||0)):v;save();render()}function updateItem(i,k,v){let r=ensureSaved();r.items[i][k]=k==='reps'?Math.max(0,Math.min(500,v||0)):v;save();render()}function removeItem(i){ensureSaved().items.splice(i,1);save();render()}function addItem(){ensureSaved().items.push({name:'Push-ups',reps:10});save();render()}function resetRoutine(){delete state.saved[editRoutine];save();render()}
function signature(w){return JSON.stringify({id:w.id,type:w.type,rounds:w.rounds,items:w.items.map(x=>[x.name,x.reps])})}function bestFor(id){const current=state.saved[id]||library.find(r=>r.id===id);const logs=state.logs.filter(l=>l.id===id&&(!current||l.signature===signature(current)));return logs.length?`<b>${Math.max(...logs.map(l=>l.actual))} reps</b><p class="hint">${logs.length} attempts. Comparable records require the same exercise targets and structure.</p>`:'<p class="hint">No attempts yet. Set your first benchmark!</p>'}
function stepsFor(w){const steps=[];const rounds=Math.max(1,Number(w.rounds)||1);const type=w.type;const add=(i,j)=>steps.push({i,j,key:i+'-'+j,name:w.items[i].name,target:repAt(w,w.items[i],j),group:type==='Superset'?Math.floor(i/2)+1:j+1});if(type==='Straight sets'){w.items.forEach((x,i)=>{for(let j=0;j<rounds;j++)add(i,j)})}else if(type==='Superset'){for(let p=0;p<w.items.length;p+=2){for(let j=0;j<rounds;j++){add(p,j);if(w.items[p+1])add(p+1,j)}}}else{for(let j=0;j<rounds;j++)w.items.forEach((x,i)=>add(i,j))}return steps}
function timerLabel(w){return w.type==='EMOM'?'60 seconds per set · start the next set on the minute':w.type==='AMRAP'?'20-minute time cap · as many clean rounds as possible':w.type==='Superset'?'Alternate paired exercises, then rest':w.type==='Straight sets'?'Finish each exercise before the next':w.type==='Ladder'||w.type==='Pyramid'?'Follow each ascending/descending rung':'Complete every exercise before starting the next round'}
function session(){const w=state.active;if(!w)return `<div class="panel"><h3>No active workout</h3><button class="btn" onclick="choose('home')">Home</button></div>`;const steps=stepsFor(w);const logged=Object.values(w.done).reduce((a,b)=>a+b,0);const next=steps.find(s=>w.done[s.key]===undefined);const goal=w.goalTargets||{};const catDone={};steps.forEach(s=>{const id=w.items[s.i].id||Object.keys(exercises).find(k=>exercises[k].variations.includes(w.items[s.i].name));if(id)catDone[id]=(catDone[id]||0)+(w.done[s.key]||0)});return `<h2>${esc(w.name)}</h2><div class="panel"><div class="row"><span class="pill">${esc(w.type)}</span><span class="muted">${steps.filter(s=>w.done[s.key]!==undefined).length}/${steps.length} sets</span></div><p class="hint">${timerLabel(w)}</p><div class="grid"><div class="stat"><b>${logged}</b><small>Completed reps</small></div><div class="stat"><b>${targetTotal(w)}</b><small>Planned reps</small></div><div class="stat"><b>${Math.floor((Date.now()-w.started)/60000)}</b><small>Elapsed min</small></div></div>${Object.keys(goal).filter(k=>goal[k]>0).map(k=>`<div class="line"><div class="row"><b>${esc(exercises[k]?.name||k)}</b><span>${catDone[k]||0} / ${goal[k]} reps</span></div><div class="bar"><div style="width:${Math.min(100,100*(catDone[k]||0)/goal[k])}%"></div></div></div>`).join('')}${next?`<div class="panel" style="margin-top:14px"><small>UP NEXT · ${w.type==='Superset'?'PAIR '+next.group:'ROUND '+(next.j+1)}</small><h2>${esc(next.name)}</h2><div class="num">${next.target} reps</div><button class="btn" onclick="setRep('${next.key}',${next.target})">✓ Log this set</button></div>`:'<p>All planned sets logged. Great work.</p>'}<div class="row line"><span>Rest / interval timer</span><button class="mini" onclick="startTimer(state.active.type==='EMOM'?60:state.active.type==='AMRAP'?1200:state.active.rest||60)">▶ Start timer</button></div><div id="rep-timer" class="num"></div><h3>Workout order</h3>${steps.map((s,n)=>`<div class="row line"><span style="flex:1">${n+1}. ${esc(s.name)} <small>· ${w.type==='Superset'?'pair '+s.group:'set '+(s.j+1)}</small></span><button class="repchip ${w.done[s.key]!==undefined?'done':''}" onclick="setRep('${s.key}',${s.target})">${w.done[s.key]!==undefined?w.done[s.key]+' ✓':s.target+' ○'}</button></div>`).join('')}<button class="btn" onclick="finish()">Finish & Save Session</button><button class="btn secondary" onclick="discard()">Discard</button></div>`}
function startTimer(seconds){if(sessionClock)clearInterval(sessionClock);const end=Date.now()+seconds*1000;const tick=()=>{const remaining=Math.max(0,Math.ceil((end-Date.now())/1000));const node=document.getElementById('rep-timer');if(node)node.textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');if(!remaining){clearInterval(sessionClock);sessionClock=null}};tick();sessionClock=setInterval(tick,250)}function setRep(key,target){const v=prompt('Actual clean reps for this set (0 to skip)',state.active.done[key]??target);if(v===null)return;const n=Number(v);if(!Number.isInteger(n)||n<0||n>500)return alert('Enter 0–500');state.active.done[key]=n;save();render()}function finish(){const w=state.active;const actual=Object.values(w.done).reduce((a,b)=>a+b,0);if(!Object.keys(w.done).length)return alert('Log at least one set first');state.logs.unshift({id:w.id,name:w.name,signature:signature(w),actual,target:targetTotal(w),date:today(),elapsed:Math.round((Date.now()-w.started)/1000),items:w.items,rounds:w.rounds});state.active=null;save();choose('progress')}function discard(){if(confirm('Discard this workout?')){state.active=null;save();choose('home')}}
function progress(){const logs=state.logs;const sum=logs.reduce((a,l)=>a+l.actual,0);const last=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const key=d.toLocaleDateString('en-CA');return logs.filter(l=>l.date===key).reduce((a,l)=>a+l.actual,0)});const top=Math.max(1,...last);return `<h2>My Progress</h2><div class="grid"><div class="stat"><b>${logs.length}</b><small>Workouts</small></div><div class="stat"><b>${sum}</b><small>Total reps</small></div><div class="stat"><b>${logs.length?Math.max(...logs.map(l=>l.actual)):0}</b><small>Best session</small></div></div><div class="panel" style="margin-top:12px"><h3>Volume · Last 7 Days</h3><div class="spark">${last.map(v=>`<div style="height:${Math.max(2,Math.round(v/top*100))}%" title="${v} reps"></div>`).join('')}</div><div class="row muted" style="font-size:11px;margin-top:7px"><span>7 days ago</span><span>Today</span></div></div><div class="panel"><h3>Workout History & Records</h3>${logs.length?logs.map(l=>{const comparable=logs.filter(x=>x.signature===l.signature);const best=Math.max(...comparable.map(x=>x.actual));return `<div class="line"><div class="row"><strong>${esc(l.name)}</strong><span class="pill">${l.actual===best?'🏆 PR':''} ${l.actual} reps</span></div><small>${l.date} · ${l.actual}/${l.target} target · ${Math.floor(l.elapsed/60)} min · comparable best ${best}</small></div>`}).join(''):'<p>No sessions logged yet. Your first workout starts the record book.</p>'}</div>`}
function phaseFor(k){return (state.monthModes||{})[k]||state.defaultMonthMode||'Straight sets'}function settings(){return `<h2>My Profile</h2><div class="panel"><h3>Monthly training plan</h3><p class="hint">Set any future month using the year navigation. Unconfigured months follow your default training method. November 2026 pyramids and December 2026 straight sets remain saved.</p><div class="row"><button class="mini" onclick="planOffset-=12;render()">← Previous year</button><button class="mini" onclick="planOffset+=12;render()">Next year →</button></div><label>Default for unconfigured months</label><select class="field" onchange="state.defaultMonthMode=this.value;save();render()">${['Pyramid','Straight sets','Volume','Circuit'].map(v=>`<option ${((state.defaultMonthMode||'Straight sets')===v)?'selected':''}>${v}</option>`).join('')}</select>${Array.from({length:12},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+planOffset+i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return `<div class="row line"><span>${d.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</span><select class="field" style="width:160px" onchange="state.monthModes=state.monthModes||{};state.monthModes['${key}']=this.value;save();render()">${['Pyramid','Straight sets','Volume','Circuit'].map(v=>`<option ${phaseFor(key)===v?'selected':''}>${v}</option>`).join('')}</select></div>`}).join('')}</div><div class="panel"><h3>Maximum clean repetitions</h3>${Object.entries(exercises).map(([id,x])=>`<div class="row line"><span>${x.name}</span><input class="field small" type="number" min="1" max="500" value="${state.max[id]}" onchange="state.max.${id}=Math.max(1,Number(this.value)||1);save();render()"></div>`).join('')}<p class="hint">Estimates until your first clean max-rep test.</p></div><div class="panel"><h3>Exclude unwanted movements</h3>${['Dips','Muscle-ups','Rows','Ring dips',...Object.values(exercises).flatMap(e=>e.variations)].map(v=>`<div class="row line"><span>${esc(v)}</span><input type="checkbox" ${state.excluded.includes(v)?'checked':''} onchange="exclude('${v.replace(/'/g,"\\'")}',this.checked)"></div>`).join('')}</div><div class="panel"><h3>Your data</h3><p class="hint">Stored locally on this device. Back up before reinstalling or clearing app storage.</p><button class="btn secondary" onclick="backup()">Export JSON backup</button><label>Import backup<input class="field" type="file" accept="application/json" onchange="restore(this)"></label></div>`}function exclude(v,yes){state.excluded=yes?[...new Set([...state.excluded,v])]:state.excluded.filter(x=>x!==v);save();render()}function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='rep-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}async function restore(input){try{const obj=JSON.parse(await input.files[0].text());if(!Array.isArray(obj.logs)||!obj.max)throw Error();if(confirm('Replace your REP data with this backup?')){state={...defaults,...obj};save();render()}}catch{alert('Invalid backup')}}render();

</script><!-- REP_VERSION_BADGE --><div style="position:fixed;top:4px;right:8px;z-index:9999;font:10px Arial;color:#64748b;pointer-events:none">REP v2.3.1</div></body></html>
